name: 測試資料來源

on:
  workflow_dispatch:
    inputs:
      date:
        description: "日期 YYYY-MM-DD"
        default: ""
      probe:
        description: "只印出候選資料來源的欄位格式"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.probe }}" = "true" ]; then ARGS="$ARGS --probe"; else ARGS="$ARGS --test"; fi
          python -m screener.enrich $ARGS
