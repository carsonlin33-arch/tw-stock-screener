name: 下載歷史本益比

on:
  workflow_dispatch:
    inputs:
      years:
        description: "下載幾年"
        default: "5"

permissions:
  contents: write

jobs:
  pe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m screener.pe_backfill --years ${{ inputs.years }} --out /tmp/pe.csv.gz
      - name: 存到 backtest-pe 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan backtest-pe
          git rm -rf --quiet . || true
          cp /tmp/pe.csv.gz pe.csv.gz
          git add pe.csv.gz
          git commit -m "本益比資料 $(date +%F)"
          git push -f origin backtest-pe
